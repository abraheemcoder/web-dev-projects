<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Website Layout</title>
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page-content">
            <!-- Header -->
            <header>
                <!-- Navbar -->
                <nav>
                    <!-- Navbar Logo -->
                    <div class="logo">
                        <h2>logo</h2>
                    </div>

                    <!-- Navbar Links -->
                    <div class="nav-links">
                        <ul>
                            <li><a href="">Home</a></li>
                            <li><a href="">Courses</a></li>
                            <li><a href="">Career</a></li>
                            <li><a href="">Blog</a></li>
                            <li><a href="">About us</a></li>
                        </ul>
                    </div>

                    <!-- Navbar Signin btn -->
                    <div class="login-btn">
                        <button>Log in</button>
                    </div>

                    <!-- Navbar Menu icon -->
                    <div class="nav-menu-icon">
                        <i class="ri-menu-3-line"></i>
                    </div>
                </nav>
            </header>

            <!-- Main -->
            <main>
                <!-- Main Content -->
                <div class="main-content">
                    <!-- left Content -->
                    <div class="left-content">
                        <h1>Learn form the <span>Coolest</span> coding platform of Pakistan</h1>
                        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Beatae totam facere cumque aliquid non vel veniam dicta, dolorum quidem quas!</p>
                        <button>Explore more</button>
                    </div>

                    <!-- Right Content -->
                    <div class="right-content">
                        <img src="right-content-image.png" alt="Right image">
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
